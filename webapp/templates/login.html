{% extends "base.html" %}
{% block title %}{{ _('Log in') }} · Diplomacy{% endblock %}
{% block content %}
<div class="card" style="max-width: 24rem; margin: 2rem auto;">
  <h1>{{ _('Log in') }}</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <label>{{ _('Email') }} <input type="email" name="email" autocomplete="username" autofocus required></label>
    <label>{{ _('Password') }} <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary">{{ _('Log in') }}</button>
  </form>
  <p class="muted">{{ _('New here, or forgot your password? Ask the admin for a link to set it.') }}</p>
</div>
{% endblock %}
