{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>{{ _('No game yet') }}</h1>
  {% if g.user.is_admin %}
    <p>{{ _('Start one from the <a href="%(url)s">admin page</a>.', url=url_for('game.admin')) }}</p>
  {% else %}
    <p>{{ _('The admin has not started a game yet.') }}</p>
  {% endif %}
</div>
{% endblock %}
