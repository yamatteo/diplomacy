[project]
name = "diplomacy-simple"
version = "0.1.0"
description = "Simplified Diplomacy web app for a single game among friends (Flask, PythonAnywhere free tier)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
# PythonAnywhere web apps run on the system Python (3.13 at most, as of 2026);
# the .venv there must be built with the same version picked on the Web tab.
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webapp"]
